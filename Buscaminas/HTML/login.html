<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>

<div class="contenedor-formulario">
  <form class="caja-formulario">
    <h1>Iniciar Sesión</h1>

    <div class="grupo-input">
      <label for="nombre">Nombre de usuario</label>
      <input type="text" id="nombre" name="nombre" required placeholder="Introduce tu nombre de usuario">
    </div>

    <div class="grupo-input">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required placeholder="Introduce tu contraseña">
    </div>

    <button type="submit" class="boton boton-submit boton-login-lila">Entrar</button>

    <p class="texto-footer">
      ¿No tienes cuenta? <a href="registrarse.html">Regístrate</a>
    </p>
  </form>
</div>

<script type="module">
import { supabase, checkPassword } from './supabase.js';

const form = document.querySelector('form');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const nombre = document.getElementById('nombre').value;
  const password = document.getElementById('password').value;

  const { data, error } = await supabase
    .from('Usuarios')
    .select('*')
    .eq('nombre', nombre)
    .single();

  if (error || !data) {
    alert('Usuario no encontrado');
    return;
  }

  const ok = await checkPassword(password, data.contraseña);
  if (!ok) {
    alert('Contraseña incorrecta');
    return;
  }

  alert('Login correcto');
  window.location.href = 'game.html'; // Cambia a la página principal del juego
});
</script>

</body>
</html>
