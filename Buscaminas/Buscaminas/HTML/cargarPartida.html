<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cargar Partida - Buscaminas</title>
    <link rel="icon" type="image/png" href="./assets/img/Bomba.svg">
    <link rel="stylesheet" href="CSS/styles.css">
</head>

<body>

    <nav class="barra-navegacion">
        <div class="botones-barra">
            <button class="nav-btn" data-target="tablero.html">Jugar partida</button>
            <button class="nav-btn" data-target="misDatos.html">Mis datos</button>
            <button class="nav-btn" data-target="cargarPartida.html">Cargar Partida</button>
            <span class="indicador"></span>
        </div>
    </nav>

    <div class="filtros-partidas">
        <label for="filtroDificultad">Dificultad:</label>
        <select id="filtroDificultad">
            <option value="">Todas</option>
            <option value="FACIL">Fácil</option>
            <option value="MEDIO">Medio</option>
            <option value="DIFICIL">Difícil</option>
        </select>

        <label for="filtroFecha">Fecha desde:</label>
        <input type="date" id="filtroFecha">

        <button id="btnFiltrar">Filtrar</button>
    </div>

    <div id="mensaje"></div>
    <ul id="listaPartidas" class="lista-partidas">
        </div>


        <script type="module" src="./assets/JS/extras/alertaDialog.js"></script>
        <script type="module" src="./assets/JS/cargarPartida.js"></script>
        <script type="module" src="./assets/JS/extras/BarraNavegacion.js"></script>

</body>

</html>
