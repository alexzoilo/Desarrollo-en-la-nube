<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Juego - Buscaminas</title>
<link rel="icon" type="image/png" href="./assets/img/Bomba.svg">
<link rel="stylesheet" href="CSS/styles.css">
</head>
<body>

<nav class="barra-navegacion">
    <div class="botones-barra">
        <button class="nav-btn" data-target="tablero.html">Jugar partida</button>
        <button class="nav-btn" data-target="misDatos.html">Mis datos</button>
        <button class="nav-btn" data-target="cargarPartida.html">Cargar Partida</button>
        <span class="indicador"></span>
    </div>
</nav>

<div id="Jugar-Buscaminas">
    <div id="panel-controles">
        <label for="dificultad">Dificultad:</label>
        <select id="dificultad">
            <option value="FACIL">Fácil</option>
            <option value="MEDIO">Medio</option>
            <option value="DIFICIL">Difícil</option>
        </select>
        <span id="temporizador">Cronometro: 00:00:00</span>
        <button id="btnControl">▶ Iniciar</button>
    </div>

    <div id="mensaje"></div>
    <div id="tablero"></div>
</div>

<div class="estadisticas-juego">
   <div id="tiempoTotalJugado">Tiempo total jugado: 00:00:00</div>
    <div id="partidasGanadas">Partidas ganadas: 0</div>
    <div id="partidasPerdidas">Partidas perdidas: 0</div>
</div>


<script type="module" src="./assets/JS/juego.js"></script>

<script type="module" src="./assets/JS/extras/BarraNavegacion.js"></script>
</body>
</html>
