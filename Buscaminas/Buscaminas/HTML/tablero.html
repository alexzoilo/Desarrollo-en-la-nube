<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buscaminas</title>
<link rel="icon" type="image/png" href="../HTML/resources/img/Bomba.svg">
<link rel="stylesheet" href="CSS/styles.css">
<style>
    #bloque { display: flex; flex-direction: column; align-items: center; padding-top: 80px; color: #fff; }
    #panel-controles { display: flex; gap: 20px; margin-bottom: 20px; align-items: center; }
    #tablero { display: grid; gap: 2px; }
    .celda {
        width: 40px; height: 40px; background: rgba(0,0,0,0.6);
        display: flex; justify-content: center; align-items: center;
        cursor: pointer; font-weight: bold; font-size: 18px;
        user-select: none; color: #fff;
    }
    .celda.revelada { background: rgba(0,0,0,0.3); cursor: default; }
    .celda.mina { background: red; }
    .celda.bandera { color: #FFD700; }
</style>
</head>
<body>

<nav class="barra-navegacion">
    <div class="botones-barra">
        <button class="nav-btn" data-target="tablero.html">Jugar partida</button>
        <button class="nav-btn" data-target="misDatos.html">Mis datos</button>
        <span class="indicador"></span>
    </div>
</nav>

<div id="bloque">
    <div id="panel-controles">
        <label for="dificultad">Dificultad:</label>
        <select id="dificultad">
            <option value="FACIL">Fácil</option>
            <option value="MEDIO">Medio</option>
            <option value="DIFICIL">Difícil</option>
        </select>
        <span id="temporizador">Tiempo: 0s</span>
    </div>

    <p id="mensaje">Presiona cualquier tecla para iniciar el juego</p>
    <div id="tablero"></div>
</div>



<script type="module">
import { Buscaminas } from "../Clases/Buscaminas.js";
import { Dificultad } from "../Clases/Dificultad.js";

let juego;
let timerInterval = null;
const tableroDiv = document.getElementById('tablero');
const mensaje = document.getElementById('mensaje');
const selectDificultad = document.getElementById('dificultad');
const temporizadorSpan = document.getElementById('temporizador');

let filas = 9;
let columnas = 9;

function ajustarFilasColumnas(dificultad) {
    switch(dificultad) {
        case "FACIL": filas = 9; columnas = 9; break;
        case "MEDIO": filas = 16; columnas = 16; break;
        case "DIFICIL": filas = 16; columnas = 30; break;
    }
}

function crearTableroHTML() {
    tableroDiv.innerHTML = '';
    tableroDiv.style.gridTemplateColumns = `repeat(${columnas}, 40px)`;
    tableroDiv.style.gridTemplateRows = `repeat(${filas}, 40px)`;
    for (let i = 0; i < filas; i++) {
        for (let j = 0; j < columnas; j++) {
            const celdaDiv = document.createElement('div');
            celdaDiv.classList.add('celda');
            celdaDiv.dataset.fila = i;
            celdaDiv.dataset.col = j;

            celdaDiv.addEventListener('click', () => {
                if (!juego) return;
                const exito = juego.descubrir(i,j);
                actualizarTablero();
                if (!exito) { 
                    alert('¡Has perdido!');
                    detenerTemporizador();
                    juego = null;
                    mensaje.textContent = 'Presiona cualquier tecla para iniciar de nuevo';
                }
                if (juego && juego.verificarVictoria()) {
                    alert('¡Has ganado!');
                    detenerTemporizador();
                    juego = null;
                    mensaje.textContent = 'Presiona cualquier tecla para iniciar de nuevo';
                }
            });

            celdaDiv.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                if (!juego) return;
                if (celdaDiv.classList.contains('revelada')) return;
                celdaDiv.classList.toggle('bandera');
            });

            tableroDiv.appendChild(celdaDiv);
        }
    }
}

function actualizarTablero() {
    for (let i = 0; i < filas; i++) {
        for (let j = 0; j < columnas; j++) {
            const celdaDiv = tableroDiv.children[i*columnas+j];
            if (juego.descubiertas[i][j]) {
                celdaDiv.classList.add('revelada');
                if (juego.tablero[i][j] === -1) celdaDiv.textContent = '💣';
                else if (juego.tablero[i][j] > 0) celdaDiv.textContent = juego.tablero[i][j];
            }
        }
    }
}

function iniciarTemporizador() {
    let tiempo = 0;
    temporizadorSpan.textContent = `Tiempo: ${tiempo}s`;
    timerInterval = setInterval(() => {
        tiempo++;
        temporizadorSpan.textContent = `Tiempo: ${tiempo}s`;
    }, 1000);
}

function detenerTemporizador() {
    clearInterval(timerInterval);
    timerInterval = null;
}

// Iniciar juego al presionar cualquier tecla
document.addEventListener('keydown', () => {
    if (!juego) {
        const dificultad = selectDificultad.value;
        ajustarFilasColumnas(dificultad);
        juego = new Buscaminas(null, filas, columnas, Dificultad[dificultad]);
        crearTableroHTML();
        actualizarTablero();
        iniciarTemporizador();
        mensaje.textContent = 'Haz clic izquierdo para descubrir, derecho para marcar bandera';
    }
});

</script>
<script type="module" src="../HTML/resources/JS/BarraNavegacion.js"></script>

</body>
</html>
