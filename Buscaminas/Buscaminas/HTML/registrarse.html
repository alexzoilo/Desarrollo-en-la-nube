<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link rel="icon" type="image/png" href="./assets/img/Bomba.svg">
    <link rel="stylesheet" href="CSS/styles.css">
</head>

<body>

    <div class="contenedor-formulario">
        <form id="registerForm" class="caja-formulario">
            <h1>Crear Cuenta</h1>

            <!-- Nombre de usuario -->
            <div class="grupo-input">
                <label for="nombre">Nombre de usuario</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Nombre de usuario">
            </div>

            <!-- Contraseña -->
            <div class="grupo-input password-container">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" required minlength="6"
                        placeholder="Contraseña">
                    <span class="toggle-password" data-target="password">👁</span>
                </div>
            </div>

            <!-- Repetir Contraseña -->
            <div class="grupo-input password-container">
                <label for="repeatpassword">Repetir Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="repeatpassword" name="repeatpassword" required minlength="6"
                        placeholder="Repetir contraseña">
                    <span class="toggle-password" data-target="repeatpassword">👁</span>
                </div>
            </div>

            <!-- Mensajes -->
            <div id="mensaje" class="mensaje-juego"></div>

            <!-- Botón registrar -->
            <button type="submit" class="boton boton-submit boton-login-lila">Registrarse</button>

            <p class="texto-footer">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
            </p>
        </form>
    </div>

    <script type="module" src="./assets/JS/registrarse.js"></script>
</body>

</html>
