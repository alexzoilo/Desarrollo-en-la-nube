<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Datos - Buscaminas</title>
    <link rel="icon" type="image/png" href="./assets/img/Bomba.svg">
    <link rel="stylesheet" href="CSS/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>
    <nav class="barra-navegacion">
        <div class="botones-barra">
            <button class="nav-btn" data-target="tablero.html">Jugar partida</button>
            <button class="nav-btn" data-target="misDatos.html">Mis datos</button>
            <button class="nav-btn" data-target="cargarPartida.html">Cargar Partida</button>
            <span class="indicador"></span>
        </div>
    </nav>

    <div class="perfil-container">
        <div class="avatar" id="avatarBtn">
            <i class="fa-solid fa-user"></i>
        </div>

        <div class="panel-datos desplegable" id="panelDatos">
            <div class="grupo-dato">
                <label for="email">Email</label>
                <input type="text" id="email" class="input-dato" disabled>
            </div>

            <div class="grupo-dato">
                <label for="nombreUsuario">Usuario:</label>
                <input type="text" id="nombreUsuario" class="input-dato">
            </div>

            <div class="grupo-dato password-container">
                <label for="passwordUsuario">Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="passwordUsuario" class="input-dato" placeholder="Nueva contraseña">
                    <span class="toggle-password">🔒</span>
                </div>
            </div>

            <div class="grupo-dato grupo-botones-datos">
                <button type="button" class="boton-guardar">Guardar</button>
                <button type="button" class="boton-eliminar">Eliminar</button>
            </div>

            <div id="mensaje" class="mensaje-juego"></div>
        </div>
    </div>



    <script type="module" src="./assets/JS/extras/alertaDialog.js"></script>
    <script type="module" src="./assets/JS/misDatos.js"></script>
    <script type="module" src="./assets/JS/extras/BarraNavegacion.js"></script>
</body>

</html>
