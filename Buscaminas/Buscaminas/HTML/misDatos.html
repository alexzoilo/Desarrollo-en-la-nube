<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Datos - Buscaminas</title>
    <link rel="icon" type="image/png" href="../HTML/resources/img/Bomba.svg">
    <link rel="stylesheet" href="CSS/styles.css">
    <style>
        /* Panel principal */
        .panel-datos {
            max-width: 400px;
            margin: 60px auto 0 auto;
            padding: 30px 25px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            color: #fff;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-datos h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        /* Grupos de campos alineados */
        .grupo-dato {
            display: grid;
            grid-template-columns: 140px 1fr; /* etiqueta a la izquierda, input a la derecha */
            align-items: center;
            gap: 10px;
        }

        .grupo-dato label {
            font-weight: bold;
        }

        .input-dato {
            padding: 10px;
            border-radius: 6px;
            border: none;
            outline: none;
            background: #fff;
            color: #2c3e50;
        }

        .input-dato:disabled {
            background: #ddd;
            color: #555;
        }

        /* Botones */
        .grupo-botones-datos {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }

        .boton-guardar {
            flex: 1;
            padding: 10px;
            background-color: #2ecc71;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .boton-guardar:hover {
            background-color: #27ae60;
        }

        .boton-eliminar {
            flex: 1;
            padding: 10px;
            background-color: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .boton-eliminar:hover {
            background-color: #c0392b;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .panel-datos {
                margin: 40px 15px 0 15px;
                padding: 20px;
            }

            .grupo-dato {
                grid-template-columns: 100px 1fr;
            }
        }
    </style>
</head>

<body>
    <nav class="barra-navegacion">
        <div class="botones-barra">
            <button class="nav-btn ">Jugar partida</button>
            <button class="nav-btn active">Mis datos</button>
            <button class="nav-btn">Ayuda</button>
            <span class="indicador"></span>
        </div>
    </nav>

    <div class="panel-datos">
        <div class="grupo-dato">
            <label for="nombreUsuario">Nombre de usuario:</label>
            <input type="text" id="nombreUsuario" class="input-dato">
        </div>
        <div class="grupo-dato">
            <label for="passwordUsuario">Contraseña:</label>
            <input type="password" id="passwordUsuario" class="input-dato">
        </div>

        <div class="grupo-botones-datos">
            <button type="button" class="boton-guardar">Guardar</button>
            <button type="button" class="boton-eliminar">Eliminar cuenta</button>
        </div>
    </div>

    <script type="module">
        import { supabase } from '../JS/Supabaseclient.js';

        document.addEventListener("DOMContentLoaded", async () => {
            const user = supabase.auth.user();
            if (!user) {
                alert("No hay usuario logueado");
                window.location.href = "login.html";
                return;
            }

            const { data, error } = await supabase
                .from('Usuarios')
                .select('*')
                .eq('password', user.id)
                .single();

            if (error || !data) {
                alert("No se pudieron cargar tus datos");
                return;
            }

            document.getElementById("nombreUsuario").value = data.nombre;
            document.getElementById("passwordUsuario").value = "********";
        });
    </script>

    <script type="module" src="../HTML/resources/JS/BarraNavegacion.js"></script>
</body>
</html>
