        <!DOCTYPE html>
        <html lang="es">
        <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Iniciar Sesión</title>
        <link rel="icon" type="image/png" href="resources/img/Bomba.svg">
        <link rel="stylesheet" href="CSS/styles.css">
        </head>
        <body>


        <div class="contenedor-formulario">
        <form id="loginForm" class="caja-formulario" >

        <h1>Iniciar Sesión</h1>

        <div class="grupo-input">
        <label for="nombre">Nombre de usuario</label>
        <input type="text" id="nombre" name="nombre" required placeholder="Introduce tu nombre de usuario">
        </div>


        <div class="grupo-input">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required placeholder="Introduce tu contraseña">
        </div>


        <button type="submit" class="boton boton-submit boton-login-lila">Entrar </button>


        <p class="texto-footer">
        ¿No tienes cuenta? <a href="registrarse.html">Regístrate</a>
        </p>
        </form>
        </div>
        </body>
        <script type="module" src="../HTML/resources/JS/login.js"></script>

        </html>
