<!DOCTYPE html>
<html lang="es">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Iniciar Sesión</title>
        <link rel="icon" type="image/png" href="./assets/img/Bomba.svg">
        <link rel="stylesheet" href="CSS/styles.css">
</head>

<body>

        <div class="contenedor-formulario">
                <form id="loginForm" class="caja-formulario">
                        <h1>Iniciar Sesión</h1>

                        <div class="grupo-input">
                                <label for="email">Email</label>
                                <input type="text" id="email" name="email" required placeholder="Email">
                        </div>

                        <div class="grupo-input password-container">
                                <label for="password">Contraseña</label>
                                <div class="input-wrapper">
                                        <input type="password" id="password" name="password" required minlength="6"
                                                placeholder="Contraseña">
                                        <span class="toggle-password" data-target="password">🔒</span>
                                </div>
                        </div>

                        <div id="mensaje" class="mensaje-juego"></div>

                        <button type="submit" class="boton boton-submit boton-login-lila">Entrar</button>

                        <p class="texto-footer">
                                ¿No tienes cuenta? <a href="registrarse.html">Regístrate</a>
                        </p>
                </form>
        </div>

        <script type="module" src="./assets/JS/login.js"></script>
</body>

</html>
